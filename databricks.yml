# This is a Declarative Automation Bundle definition for financefeed.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: financefeed
  uuid: 80e6704d-4345-4fa0-b877-f17d32f58989

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

resources:
  schemas:
    dev_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-dc4c06f4-16dc.cloud.databricks.com
    variables:
      catalog: workspace
      schema: financefeed
  prod:
    mode: production
    workspace:
      host: https://dbc-dc4c06f4-16dc.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/roosxfabian@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/roosxfabian@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: financefeed
    permissions:
      - user_name: roosxfabian@gmail.com
        level: CAN_MANAGE
